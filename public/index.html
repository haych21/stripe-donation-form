<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

    <title>Donation Form</title>

    <script src="https://js.stripe.com/v3/"></script>
</head>

<body>

  <main class="checkout-container">

    <section class="donation-summary">

      <h1>Monthly Donation</h1>

      <div class="summary-card">

        <p class="label">Product</p>

        <select
          id="cause-select"
          autocomplete="off"
        >

          <option value="" selected disabled>
            Select a cause
          </option>

        </select>


        <p class="label">Donation Amount</p>

        <select
          id="donation-amount"
          autocomplete="off"
        >

          <option value="" selected disabled>
            Select an amount
          </option>

        </select>


        <p class="label">
          Preferred Start Date
        </p>

        <select id="start-date">

          <option value="">
            Select a start date
          </option>

          <option value="1">
            1st of the month
          </option>

          <option value="15">
            15th of the month
          </option>

          <option value="26">
            26th of the month
          </option>

        </select>


        <p class="small-text">
          Your monthly donation helps provide urgent aid to families in need.
        </p>

      </div>


      <div class="secure-box">

        <p>
          🔒 Secure payments powered by Stripe
        </p>

      </div>

    </section>


    <section class="checkout-form">

      <h2>Donor Information</h2>

      <form autocomplete="off">

        <div class="input-group">

          <label for="full-name">
            Full Name
          </label>

          <input
            type="text"
            id="full-name"
            placeholder="John Smith"
          />

        </div>


        <div class="input-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="john@example.com"
          />

        </div>


        <div class="input-group">

          <label for="phone">
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="+44 7123 456789"
          />

        </div>


        <div class="input-group">

          <label for="address">
            Address
          </label>

          <input
            type="text"
            id="address"
            placeholder="123 Example Street"
          />

        </div>


        <div class="input-group">

          <label for="postcode">
            Postcode
          </label>

          <input
            type="text"
            id="postcode"
            placeholder="SW1A 1AA"
          />

        </div>


        <div class="payment-method">

          <p class="label">
            Payment Method
          </p>

          <div class="payment-method-options">

            <label class="payment-option">

              <input
                type="radio"
                name="payment-method"
                value="card"
                checked
              />

              <span>
                Card
              </span>

            </label>


            <label class="payment-option">

              <input
                type="radio"
                name="payment-method"
                value="bacs_debit"
              />

              <span>
                Bacs Direct Debit
              </span>

            </label>

          </div>

        </div>


        <div class="payment-placeholder">

          <div id="payment-element"></div>

        </div>


        <div class="gift-aid">

          <input
            type="checkbox"
            id="gift-aid"
          />

          <label for="gift-aid">
            I am a UK taxpayer and want to claim Gift Aid on this donation.
          </label>

        </div>


        <button type="submit">
          Continue To Payment
        </button>

      </form>

    </section>

  </main>


  <script src="main.js"></script>

</body>

</html>
